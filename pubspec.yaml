name: super_store_e_commerce_flutter
description: "Flutter E-Commerce App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Updated core packages
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  http: ^1.3.0
  icons_plus: ^5.0.0
  
  # Added critical dependencies
  web: ^1.1.1
  js: ^0.7.0  # Required for JS interop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  # Updated linter

dependency_overrides:
  web: ^1.1.1
  vector_math: ^2.1.5
  material_color_utilities: ^0.12.0
  lints: ^6.0.0
  flutter_svg: ^2.1.0  # Often needed for vector graphics

flutter:
  uses-material-design: true
  assets:
    - assets/images/